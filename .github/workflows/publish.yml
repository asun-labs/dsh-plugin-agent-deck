name: Publish

# Publishes to npm only when a version tag is pushed, or when a maintainer
# runs the workflow manually. `pnpm publish` runs `prepublishOnly`, which is
# `pnpm run check` (build + typecheck + test), so a red build cannot publish.
# Requires an NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable corepack
        run: corepack enable

      # Guard against republishing: a tag may be pushed after the same version
      # was already published by hand.
      - name: Check whether this version is already on npm
        id: guard
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        if: steps.guard.outputs.skip == 'false'
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
